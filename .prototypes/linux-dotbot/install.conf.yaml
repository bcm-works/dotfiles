- defaults:
    link:
      create: true
      relink: true
      backup: true

- create:
    - ~/.vim

- link:
    ~/.bash_profile: linux/bash/bash_profile
    ~/justfile: just/justfile
    ~/.vim/colors: linux/vim/colours
    ~/.vimrc: linux/vim/vimrc

- shell:
  - [bash ~/Dotfiles/bin/setup.sh, Initial setup]
  - [echo '' >> ~/.bashrc && echo '. ~/.bash_profile' >> ~/.bashrc, Bash]
  - [bash ~/Dotfiles/dev/git/git.sh, Git]
  - [bash ~/Dotfiles/just/just.sh, Just]
  - [bash ~/Dotfiles/dev/zed.sh, Zed]
  - [bash ~/Dotfiles/dev/node.sh, Node]
  - [bash ~/Dotfiles/dev/deno.sh, Deno]
  - [bash ~/Dotfiles/dev/go.sh, Go]
  - [bash ~/Dotfiles/dev/docker/docker.sh, Docker]
  - [bash ~/Dotfiles/fonts/fonts.sh, Fonts]
  - [bash ~/Dotfiles/linux/packages/flatpak.sh, Flatpak]
  - [bash ~/Dotfiles/linux/distros/ubuntu.sh, Ubuntu]
  - [bash ~/Dotfiles/linux/gnome/gnome.sh, Gnome]
  - [bash ~/Dotfiles/linux/hardware/keychron-keyboards.sh, Keychron keyboards]
  - [bash ~/Dotfiles/linux/packages/chrome.sh, Chrome]
